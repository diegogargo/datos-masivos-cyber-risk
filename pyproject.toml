[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-vulnerability-risk-analysis"
version = "0.1.0"
description = "Reproducible NVD and CISA KEV vulnerability data project"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32,<3",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

